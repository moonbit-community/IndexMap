# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Setup MoonBit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- nightly
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check Moonbit Version
        run: |
          moon version --all
          moon update
          moon check --target all --deny-warn

      - name: Run tests with coverage
        run: |
          moon test --target all --enable-coverage
          moon test --target all --release

      - name: Generate and upload coverage report
        run: |
          moon coverage report \
            -f coveralls \
            -o codecov_report.json \
            --service-name github \
            --service-job-id "$GITHUB_RUN_ID" \
            --service-pull-request "${{ github.event.pull_request.number }}" \
            --send-to codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
